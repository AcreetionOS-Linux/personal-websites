# HarrisOS GRUB config — derived from AcreetionOS grub.cfg
# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Use graphics-mode output
insmod all_video
insmod gfxterm
insmod jpeg
insmod png

if loadfont "${prefix}/fonts/unicode.pf2" ; then
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm

    # HarrisOS boot colors
    set color_normal=white/black
    set color_highlight=#ffd700/black
    # splash: grub/splash.png ships with the base — replace with your own
    # background_image -m stretch (${root})/boot/grub/splash.png
fi

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == "x86_64" ]; then
        set archiso_platform="x86_64-efi"
    fi
else
    set archiso_platform="i386-pc"
fi

# Menu entries
menuentry "HarrisOS install medium (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'archlinux' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n nvme_core.default_ps_max_latency_us=0 i915.force_probe=* i915.enable_guc=3 i915.enable_fbc=1 quiet splash loglevel=3 vt.global_cursor_default=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "HarrisOS (Compatibility Mode - Low Resolution)" --class arch --class gnu-linux --class gnu --class os --id 'archlinux-compat' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n nvme_core.default_ps_max_latency_us=0 nomodeset i915.modeset=0 nouveau.modeset=0 vt.global_cursor_default=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "HarrisOS install medium with speakup screen reader (%ARCH%, ${archiso_platform})" --hotkey s --class arch --class gnu-linux --class gnu --class os --id 'archlinux-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on copytoram=n nvme_core.default_ps_max_latency_us=0 i915.force_probe=* i915.enable_guc=3 i915.enable_fbc=1 quiet splash loglevel=3 vt.global_cursor_default=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "HarrisOS (Safe Mode - Basic Graphics)" --class arch --class gnu-linux --class gnu --class os --id 'archlinux-safemode' {
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n nvme_core.default_ps_max_latency_us=0 nomodeset i915.modeset=0 nouveau.modeset=0 vga=normal
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi

if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' -a -f '/shellx64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    fi
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    reboot
}
